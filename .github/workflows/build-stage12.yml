name: Build T583 Stage21 kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make python3 cpio unzip zip device-tree-compiler

      - name: Clone newer T583-capable Exynos7870 kernel source
        run: |
          git clone --depth=1 --branch lineage-21 https://github.com/gtaxlwifi-los21/android_kernel_samsung_exynos7870.git kernel
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' kernel/scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' kernel/scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Clone AArch64 GCC 4.9 toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
          cd toolchain
          git checkout android-8.1.0_r1 || git checkout android-8.0.0_r1 || true
          test -x bin/aarch64-linux-android-gcc

      - name: Configure Stage21 kernel
        working-directory: kernel
        shell: bash
        run: |
          set -eux
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=p
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-"
          export HOSTCFLAGS='-fcommon'
          make O=out lineage-gtaxlwifi_defconfig
          CFG=out/.config

          # Android 11 base requirements already proven useful in Stage14/19.
          scripts/config --file "$CFG" -e MEMCG
          scripts/config --file "$CFG" -e MEMCG_SWAP || true
          scripts/config --file "$CFG" -e MEMCG_SWAP_ENABLED || true
          scripts/config --file "$CFG" -e EXT4_FS_POSIX_ACL
          scripts/config --file "$CFG" -e EXT4_FS_SECURITY
          scripts/config --file "$CFG" -e EXT4_ENCRYPTION || true
          scripts/config --file "$CFG" -e SECCOMP
          scripts/config --file "$CFG" -e SECCOMP_FILTER
          scripts/config --file "$CFG" -e ANDROID_BINDER_IPC
          scripts/config --file "$CFG" --set-str ANDROID_BINDER_DEVICES 'binder,hwbinder,vndbinder'

          # Stage20 gets through property init, then Android 11 libprocessgroup reports
          # missing cpuset/freezer/schedtune mounts before init dies in SubcontextChildReap.
          # Enable every legacy cgroup controller this 3.18 tree exposes so libprocessgroup
          # can use the Android legacy hierarchy even though true cgroup2 is unavailable.
          scripts/config --file "$CFG" -e CGROUPS
          scripts/config --file "$CFG" -e CGROUP_SCHED
          scripts/config --file "$CFG" -e FAIR_GROUP_SCHED
          scripts/config --file "$CFG" -e CPUSETS
          scripts/config --file "$CFG" -e CGROUP_CPUACCT
          scripts/config --file "$CFG" -e CGROUP_FREEZER
          scripts/config --file "$CFG" -e CGROUP_DEVICE
          scripts/config --file "$CFG" -e CGROUP_PERF || true
          scripts/config --file "$CFG" -e BLK_CGROUP || true
          scripts/config --file "$CFG" -e CGROUP_PIDS || true
          scripts/config --file "$CFG" -e SCHED_TUNE || true

          # Keep Stage14 touch IRQ panic isolated for boot bring-up.
          scripts/config --file "$CFG" -d TOUCHSCREEN_FTS7
          scripts/config --file "$CFG" -d TOUCHSCREEN_FTS
          scripts/config --file "$CFG" -d TOUCHSCREEN_FTS1BA90A

          # SELinux must remain present. Stage18 vendor genfscon patch now lets A11 policy
          # compile/load successfully; disabling SELinux makes first-stage init fail.
          scripts/config --file "$CFG" -e SECURITY_SELINUX
          scripts/config --file "$CFG" -e SECURITY_SELINUX_BOOTPARAM || true
          scripts/config --file "$CFG" --set-val SECURITY_SELINUX_BOOTPARAM_VALUE 0 || true
          scripts/config --file "$CFG" --set-val SECURITY_SELINUX_CHECKREQPROT_VALUE 0 || true

          make O=out olddefconfig

          echo '=== Stage21 cgroup/SELinux/touch config ==='
          grep -E 'CONFIG_(CGROUPS|CGROUP_SCHED|FAIR_GROUP_SCHED|CPUSETS|CGROUP_CPUACCT|CGROUP_FREEZER|CGROUP_DEVICE|CGROUP_PERF|BLK_CGROUP|CGROUP_PIDS|SCHED_TUNE|SECURITY_SELINUX|TOUCHSCREEN_FTS)' out/.config || true

          # Hard requirements known to exist in this kernel tree.
          grep -q '^CONFIG_CGROUPS=y' out/.config
          grep -q '^CONFIG_CGROUP_SCHED=y' out/.config
          grep -q '^CONFIG_FAIR_GROUP_SCHED=y' out/.config
          grep -q '^CONFIG_CPUSETS=y' out/.config
          grep -q '^CONFIG_CGROUP_CPUACCT=y' out/.config
          grep -q '^CONFIG_CGROUP_FREEZER=y' out/.config
          grep -q '^CONFIG_CGROUP_DEVICE=y' out/.config
          grep -q '^CONFIG_SECURITY_SELINUX=y' out/.config
          ! grep -q '^CONFIG_TOUCHSCREEN_FTS1BA90A=y' out/.config
          ! grep -q '^CONFIG_TOUCHSCREEN_FTS7=y' out/.config

      - name: Build kernel and DTBs
        working-directory: kernel
        shell: bash
        run: |
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=p
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-"
          export HOSTCFLAGS='-fcommon'
          make O=out -j$(nproc) Image dtbs

      - name: Collect Stage21 outputs
        shell: bash
        run: |
          set -eux
          mkdir -p artifact/dtb
          cp kernel/out/arch/arm64/boot/Image artifact/Image_STAGE21_T583_CGROUP_NOTOUCH
          cp kernel/out/.config artifact/config_STAGE21_T583_CGROUP_NOTOUCH.txt
          find kernel/out/arch/arm64/boot/dts -type f -name '*gtaxladwifi*.dtb' -print -exec cp -v {} artifact/dtb/ \; || true
          test -s artifact/Image_STAGE21_T583_CGROUP_NOTOUCH
          sha256sum artifact/Image_STAGE21_T583_CGROUP_NOTOUCH artifact/config_STAGE21_T583_CGROUP_NOTOUCH.txt > artifact/SHA256SUMS.txt
          find artifact/dtb -type f -name '*.dtb' -exec sha256sum {} \; >> artifact/SHA256SUMS.txt || true
          printf '%s\n' 'Stage21 boot kernel for SM-T583.' > artifact/README.txt
          printf '%s\n' 'Stage18/20 vendor policy/property patches must remain applied on-device.' >> artifact/README.txt
          printf '%s\n' 'Touch remains disabled while enabling Android 11 legacy cgroup controllers (cpuset/freezer/device/etc.).' >> artifact/README.txt

      - name: Upload Stage21 artifact
        uses: actions/upload-artifact@v4
        with:
          name: T583_STAGE21_CGROUP_NOTOUCH_KERNEL
          path: artifact/
          if-no-files-found: error
          retention-days: 30
