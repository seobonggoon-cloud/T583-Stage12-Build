name: Build T583 Stage12 kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make python3 cpio unzip zip device-tree-compiler

      - name: Clone T583-capable Exynos7870 kernel source
        run: |
          git clone --depth=1 --branch lineage-17.0 https://github.com/Valera1978/android_kernel_samsung_exynos7870.git kernel
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' kernel/scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;$/extern YYLTYPE yylloc;/' kernel/scripts/dtc/dtc-lexer.lex.c_shipped || true
          grep -n 'yylloc' kernel/scripts/dtc/dtc-lexer.l | head || true
          grep -n 'yylloc' kernel/scripts/dtc/dtc-lexer.lex.c_shipped | head || true

      - name: Clone AArch64 GCC 4.9 toolchain
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain
          cd toolchain
          git checkout android-8.1.0_r1 || git checkout android-8.0.0_r1 || true
          test -x bin/aarch64-linux-android-gcc
          ./bin/aarch64-linux-android-gcc --version | head -1

      - name: Configure and patch Android 11 requirements and T583 hardware
        working-directory: kernel
        shell: bash
        run: |
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=p
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-"
          export HOSTCFLAGS='-fcommon'
          make O=out lineage-gtaxlwifi_defconfig
          CFG=out/.config
          scripts/config --file "$CFG" -e MEMCG
          scripts/config --file "$CFG" -e MEMCG_SWAP || true
          scripts/config --file "$CFG" -e MEMCG_SWAP_ENABLED || true
          scripts/config --file "$CFG" -e EXT4_FS_POSIX_ACL
          scripts/config --file "$CFG" -e EXT4_FS_SECURITY
          scripts/config --file "$CFG" -e EXT4_ENCRYPTION || true
          scripts/config --file "$CFG" -e CGROUPS
          scripts/config --file "$CFG" -e CGROUP_CPUACCT
          scripts/config --file "$CFG" -e SECCOMP
          scripts/config --file "$CFG" -e SECCOMP_FILTER
          scripts/config --file "$CFG" -e ANDROID_BINDER_IPC
          scripts/config --file "$CFG" --set-str ANDROID_BINDER_DEVICES 'binder,hwbinder,vndbinder'
          scripts/config --file "$CFG" --set-val SECURITY_SELINUX_CHECKREQPROT_VALUE 0 || true

          # SM-T583 (gtaxladwifi) uses STMicro FTS1BA90A, while the T580 base
          # defconfig enables FTS7. Do not leave both drivers competing for
          # the same stm,fts_touch compatible node.
          scripts/config --file "$CFG" -d TOUCHSCREEN_FTS7
          scripts/config --file "$CFG" -d TOUCHSCREEN_FTS
          scripts/config --file "$CFG" -e TOUCHSCREEN_FTS1BA90A

          make O=out olddefconfig
          grep -E 'CONFIG_TOUCHSCREEN_FTS(1BA90A|7)?=' out/.config || true
          test "$(grep '^CONFIG_TOUCHSCREEN_FTS1BA90A=' out/.config)" = 'CONFIG_TOUCHSCREEN_FTS1BA90A=y'
          ! grep -q '^CONFIG_TOUCHSCREEN_FTS7=y' out/.config

      - name: Build kernel and DTBs
        working-directory: kernel
        shell: bash
        run: |
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=p
          export CROSS_COMPILE="$GITHUB_WORKSPACE/toolchain/bin/aarch64-linux-android-"
          export HOSTCFLAGS='-fcommon'
          make O=out -j$(nproc) Image dtbs

      - name: Collect T583 outputs
        shell: bash
        run: |
          set -eux
          mkdir -p artifact/dtb
          cp kernel/out/arch/arm64/boot/Image artifact/Image_STAGE12_T583_TOUCHFIX
          cp kernel/out/.config artifact/config_STAGE12_T583_TOUCHFIX.txt
          find kernel/out/arch/arm64/boot/dts -type f -name '*gtaxladwifi*.dtb' -print -exec cp -v {} artifact/dtb/ \; || true
          test -s artifact/Image_STAGE12_T583_TOUCHFIX
          sha256sum artifact/Image_STAGE12_T583_TOUCHFIX artifact/config_STAGE12_T583_TOUCHFIX.txt > artifact/SHA256SUMS.txt
          find artifact/dtb -type f -name '*.dtb' -exec sha256sum {} \; >> artifact/SHA256SUMS.txt || true
          printf '%s\n' 'Stage12 touch-fix kernel build for SM-T583 (gtaxladwifi KOR).' > artifact/README.txt
          printf '%s\n' 'T583 touchscreen: CONFIG_TOUCHSCREEN_FTS1BA90A=y; T580 FTS7 disabled.' >> artifact/README.txt
          printf '%s\n' 'Kernel source: Valera1978/android_kernel_samsung_exynos7870 lineage-17.0.' >> artifact/README.txt
          printf '%s\n' 'Do NOT flash Image directly as a boot partition; package it into boot.img first.' >> artifact/README.txt

      - name: Upload Stage12 artifact
        uses: actions/upload-artifact@v4
        with:
          name: T583_STAGE12_TOUCHFIX_KERNEL
          path: artifact/
          if-no-files-found: error
          retention-days: 30
